<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lich Map Room Database</title>
    
    <!-- Favicons (existing) -->
    <link rel="manifest" href="static/icons/site.webmanifest">
    <link rel="icon" href="static/icons/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="32x32" href="static/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="static/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="static/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f1420" media="(prefers-color-scheme: dark)">
    
    <!-- Fonts: the two faces used above the fold. The rest load on demand from tokens.css.
         crossorigin is required for font preloads, even from the same origin. -->
    <link rel="preload" href="static/fonts/fraunces-600.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="static/fonts/jetbrains-mono-400.woff2" as="font" type="font/woff2" crossorigin>
    
    <!-- Styles (existing) -->
    <link rel="stylesheet" href="static/css/pico.min.css">
    <link rel="stylesheet" href="static/css/tokens.css">
    <link rel="stylesheet" href="static/css/room.css">
    <link rel="stylesheet" href="static/css/prism.css">
    
</head>
<body>
    <!-- Loading Screen (styles live in static/css/room.css) -->
    <div id="loading-screen" class="loading-screen" role="status" aria-live="polite">
        <div id="loading-spinner" class="loading-spinner" aria-hidden="true"></div>
        <div id="loading-progress" class="loading-progress">Loading room data...</div>
        <!-- Download progress: visual only (aria-hidden); the polite status text above is updated at coarse steps -->
        <div id="loading-bar" class="loading-bar" aria-hidden="true" hidden>
            <div id="loading-bar-fill" class="loading-bar-fill"></div>
        </div>
        <div id="loading-detail" class="loading-detail" aria-hidden="true" hidden></div>
        <div id="loading-note" class="loading-note" hidden></div>
        <!-- Error state: announced assertively from app.js, so this container stays silent -->
        <div id="loading-error" class="loading-error" aria-live="off" hidden>
            <p id="loading-error-message" class="loading-error-message"></p>
            <p id="loading-error-detail" class="loading-error-detail"></p>
            <button type="button" id="loading-retry" class="loading-retry">Retry</button>
        </div>
    </div>
    
    <!-- App Container -->
    <div id="app" class="hidden"></div>
    
    <!-- Live regions for accessibility -->
    <div id="announcement-region" aria-live="polite" aria-atomic="true" class="sr-only"></div>
    <div id="alert-region" aria-live="assertive" aria-atomic="true" class="sr-only"></div>
    
    <!-- Scripts -->
    <script src="static/js/prism.js"></script>
    <script src="static/js/prism-clike.min.js"></script>
    <script src="static/js/prism-ruby.min.js"></script>
    <script type="module" src="static/js/app.js"></script>
</body>
</html>
